name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: git ls-files --error-unmatch package-lock.json >/dev/null 2>&1 || echo "LOCKFILE $(gzip -9c package-lock.json | base64 -w0)"
      - run: npm test
      - run: npm run build

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lockfile yet: this session could not reach the npm registry. The job uploads the one it makes.
      - run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm run typecheck
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist
      # Until a lockfile is committed, print the one npm made, for copying into the repository.
      - run: git ls-files --error-unmatch package-lock.json >/dev/null 2>&1 || echo "LOCKFILE $(gzip -9c package-lock.json | base64 -w0)"

  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm test
      # Until a lockfile is committed, print the one npm made, for copying into the repository.
      - run: git ls-files --error-unmatch package-lock.json >/dev/null 2>&1 || echo "LOCKFILE $(gzip -9c package-lock.json | base64 -w0)"
